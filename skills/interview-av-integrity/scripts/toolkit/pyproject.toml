[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-integrity-analyzer"
version = "0.2.0"
description = "Local-first plosive and lip-closure integrity analysis for interview recordings"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
dependencies = [
  "av==17.0.1",
  "mediapipe==1.0.0",
  "numpy>=2,<3",
  "Pillow>=10,<13",
  "matplotlib>=3.8,<4",
]

[tool.setuptools.packages.find]
include = ["video_integrity_analyzer*"]
